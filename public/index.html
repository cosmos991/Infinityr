<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100e1b">
<meta name="description" content="기사 루나와 함께 내려가는 무한 픽셀 던전">
<title>슬라임 지하굴</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="game.js"></script>
</head>
<body>
<main>
<header><div><span class="eyebrow">SLIME HOLLOW</span><h1>슬라임 지하굴</h1></div><div class="wallet"><i class="coin" aria-hidden="true"></i><div><small>보유 골드</small><strong id="gold">0</strong></div></div></header>
<section class="battle" aria-label="자동 전투">
<div class="battle-top"><div><small id="biome">이끼 동굴</small><h2><span id="floor">1</span>층</h2></div><span class="mode" id="mode">자동 사냥</span></div>
<div class="battle-scene">
<canvas width="384" height="160" id="scene" aria-label="기사 루나와 슬라임의 픽셀 전투"></canvas>
<p id="skill-banner" class="skill-banner" aria-hidden="true" hidden></p>
<p id="clear-banner" class="clear-banner" aria-hidden="true" hidden></p>
</div>
<div class="combatants">
<div><div class="name"><strong>기사 루나 <span id="job-name" class="job-name" hidden></span></strong><small id="hero-hp">60 / 60</small></div><div class="track"><div id="hero-bar"></div></div></div>
<div><div class="name"><strong id="enemy">이끼 슬라임</strong><small id="enemy-hp">24 / 24</small></div><div class="track"><div id="enemy-bar"></div></div></div>
</div>
</section>
<div class="status" role="status"><span id="message">슬라임을 사냥하고 보스를 쓰러뜨리면 다음 층이 열려요.</span></div>
<section id="job-choices" class="job-choices" aria-label="2차 전직" hidden>
<h2>루나의 2차 전직</h2>
<p>10층을 클리어했어요! 두 직업 중 하나를 골라 주세요.</p>
<div class="actions">
<button type="button" id="job-rps"><span><strong>가위바위보 전사</strong><small>한 판 승부에서 이기면 다음 공격 2배</small></span></button>
<button type="button" id="job-muk"><span><strong>묵찌빠 전사</strong><small>공격권을 잡고 손을 맞추면 다음 공격 3연타</small></span></button>
</div>
</section>
<section class="actions" aria-label="전투 조작">
<button id="upgrade"><span class="icon sword" aria-hidden="true">⚔</span><span class="upgrade-label"><strong>검 강화</strong><small id="cost">0 / 6골드</small><span class="upgrade-track" aria-hidden="true"><span id="upgrade-fill"></span></span></span></button>
<button id="challenge" aria-describedby="boss-forecast"><span class="icon" aria-hidden="true">▾</span><span><strong id="challenge-label">보스 도전</strong><small id="target">1층 왕슬라임</small></span></button>
</section>
<p id="boss-forecast" class="boss-forecast" hidden><span id="boss-forecast-text"></span><small id="boss-tip" hidden></small></p>
<section class="star-choices" id="star-choices" aria-labelledby="star-heading" hidden>
<h2 id="star-heading">별자리 강화</h2>
<p id="star-floor"></p>
<div class="star-cards">
<button type="button" class="star-card" id="star-sword" data-star="sword" hidden><img src="art/star-sword.webp" alt="" loading="lazy"><span class="star-card-caption"><strong>검자리</strong><small id="star-sword-detail"></small></span></button>
<button type="button" class="star-card" id="star-shield" data-star="shield" hidden><img src="art/star-shield.webp" alt="" loading="lazy"><span class="star-card-caption"><strong>방패자리</strong><small id="star-shield-detail"></small></span></button>
<button type="button" class="star-card" id="star-lantern" data-star="lantern" hidden><img src="art/star-lantern.webp" alt="" loading="lazy"><span class="star-card-caption"><strong>등불자리</strong><small id="star-lantern-detail"></small></span></button>
</div>
</section>
<details class="extra-options">
<summary>추가 설정</summary>
<div class="actions secondary-actions">
<button id="vitality"><span class="icon" aria-hidden="true">♥</span><span><strong>체력 강화</strong><small id="vitality-cost">12 골드</small></span></button>
</div>
<div class="auto-settings">
  <label for="auto-boss"><input type="checkbox" id="auto-boss" disabled> 보스 자동 도전</label>
  <small>이길 수 있는 보스만 도전해요.</small>
</div>
</details>
<section id="return-summary" class="return-summary" aria-label="방치 결과" hidden>
  <p id="return-summary-text" role="status"></p>
  <button type="button" id="dismiss-summary">닫기</button>
</section>
<footer><div><small>검 레벨</small><strong id="level">1</strong></div><div><small>공격력</small><strong id="attack">8</strong></div><div><small>최고 클리어</small><strong id="best">—</strong></div></footer>
<details id="star-progress" class="save-panel star-progress" hidden>
<summary>루나의 별자리 <span id="star-total"></span></summary>
<ul id="star-ranks">
<li id="rank-sword"></li>
<li id="rank-shield"></li>
<li id="rank-lantern"></li>
</ul>
</details>
<details class="save-panel">
<summary>서버 저장 <span id="save-status">연결 중</span></summary>
<p>저장 코드를 보관하면 다른 기기에서도 이어서 할 수 있어요. 이 코드로 저장에 접근할 수 있으니 개인적으로 보관하세요.</p>
<div class="save-controls"><button type="button" id="copy-save">저장 코드 복사</button></div>
<form id="restore-save">
<label for="save-input">다른 기기의 저장 코드</label>
<div class="save-controls"><input id="save-input" name="code" spellcheck="false" autocapitalize="none" autocomplete="off" required><button>이어 하기</button></div>
</form>
<div class="save-controls reset-controls"><button type="button" id="reset-save" disabled>진행 초기화</button></div>
<p id="save-message" role="status"></p>
</details>
</main>
</body>
</html>
